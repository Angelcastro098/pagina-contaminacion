<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impacto ambiental | Simulación</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#10151a;color:#f7e9d0;font-family:Georgia,'Times New Roman',serif}.escena,#canvas{position:fixed;inset:0;width:100%;height:100%}#canvas{display:block}.rotulo{position:fixed;top:24px;left:28px;display:grid;gap:5px;color:#ffedcc;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 2px 12px #000;pointer-events:none;opacity:.72}.rotulo span{font:600 11px/1.2 monospace}.rotulo strong{font-size:clamp(14px,2vw,22px);font-weight:400;letter-spacing:.06em}
</style>
</head>
<body><main class="escena" aria-label="Simulación visual de una explosión sobre un paisaje natural"><canvas id="canvas"></canvas><div class="rotulo" aria-hidden="true"><span>CLASE 1</span><strong>Impacto ambiental</strong></div></main>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let width=0,height=0,dpr=1,start=performance.now(),last=start;const state={trees:[],fire:[],debris:[],ash:[],smoke:[]};const random=(a,b)=>Math.random()*(b-a)+a;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const ease=v=>1-(1-v)**3;
function resize(){dpr=Math.min(devicePixelRatio||1,2);width=innerWidth;height=innerHeight;canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);state.trees=[];for(let i=0;i<Math.round(clamp(width/17,38,100));i++)state.trees.push({x:(i+.5)*width/Math.round(clamp(width/17,38,100))+random(-12,12),y:height*random(.69,.87),size:random(.65,1.35)});}
function particles(){for(let i=0;i<180;i++){let a=random(0,7),s=random(40,240);state.fire.push({vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:random(.5,1.4),age:0,size:random(1,5)});}for(let i=0;i<120;i++)state.debris.push({x:width/2+random(-90,90),y:height*.7,vx:random(-150,150),vy:random(-470,-100),spin:random(-8,8),angle:random(0,7),size:random(2,7),age:0,life:random(2.5,6)});for(let i=0;i<100;i++)state.ash.push({x:random(0,width),y:random(height*.35,height),vy:random(-45,-10),size:random(.5,2.8),phase:random(0,7)});for(let i=0;i<64;i++)state.smoke.push({dx:random(-100,100),dy:random(-80,50),size:random(25,90),phase:random(0,7)});}
function sky(t){let r=clamp((t-3.8)/4,0,1),d=clamp((t-6)/2,0,1),g=ctx.createLinearGradient(0,0,0,height);g.addColorStop(0,`rgb(${30+r*35-d*16},${135-r*95-d*25},${207-r*135-d*25})`);g.addColorStop(1,`rgb(${92+r*48-d*35},${190-r*125-d*40},${224-r*150-d*40})`);ctx.fillStyle=g;ctx.fillRect(0,0,width,height);ctx.fillStyle=`rgba(255,255,220,${.34-d*.2})`;for(let i=0;i<7;i++){let x=width*(i/6)+Math.sin(t*.06+i)*18,y=height*(.13+(i%3)*.08);ctx.beginPath();ctx.ellipse(x,y,85,20,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(x-30,y-10,25,0,7);ctx.arc(x+10,y-15,34,0,7);ctx.fill();}}
function tree(q,des,t){let impact=clamp(1-Math.abs(q.x-width/2)/(width*.55),0,1),fall=clamp((des-.58)*2.4*impact,0,1),x=q.x+(q.x-width/2)*des*.16,y=q.y+des*28;ctx.save();ctx.translate(x,y);ctx.rotate(fall*(q.x<width/2?-.98:.98));ctx.globalAlpha=1-des*.18;ctx.fillStyle='#302b22';ctx.fillRect(-3*q.size,-50*q.size,6*q.size,54*q.size);ctx.fillStyle=des>.55?'#303226':'#1e4d2e';ctx.beginPath();ctx.moveTo(0,-93*q.size);ctx.lineTo(-30*q.size,-37*q.size);ctx.lineTo(29*q.size,-37*q.size);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(0,-72*q.size);ctx.lineTo(-38*q.size,-8*q.size);ctx.lineTo(38*q.size,-8*q.size);ctx.closePath();ctx.fill();ctx.restore();}
function landscape(t){let des=ease(clamp((t-1)/5.2,0,1)),push=Math.min(1,des*1.7);ctx.fillStyle=`rgb(${34-des*18},${94-des*58},${73-des*53})`;ctx.beginPath();ctx.moveTo(0,height*.7);for(let x=0;x<=width;x+=24)ctx.lineTo(x,height*(.61+Math.sin(x*.007)*.04+Math.sin(x*.019)*.025+push*.18));ctx.lineTo(width,height);ctx.lineTo(0,height);ctx.fill();ctx.fillStyle=`rgb(${27-des*15},${61-des*42},${43-des*34})`;ctx.fillRect(0,height*.83+push*24,width,height);state.trees.forEach(q=>tree(q,des,t));}
function fire(t,dt){let p=clamp((t-.3)/1.5,0,1);if(p<=0)return;let r=(55+ease(p)*Math.min(width,height)*.32)*(1+Math.sin(t*16)*.025),x=width/2,y=height*.76,g=ctx.createRadialGradient(x,y-r*.45,2,x,y-r*.35,r);g.addColorStop(0,'#fff');g.addColorStop(.2,'#fff9a6');g.addColorStop(.48,'#ffad22');g.addColorStop(.78,'#e33a0a');g.addColorStop(1,'rgba(70,8,2,0)');ctx.save();ctx.globalCompositeOperation='lighter';ctx.shadowColor='#ff6b16';ctx.shadowBlur=45;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y-r*.35,r,0,7);ctx.fill();ctx.restore();state.fire.forEach(q=>{q.age+=dt;let a=clamp(1-q.age/q.life,0,1);if(a){ctx.fillStyle=`rgba(255,${80+a*160},30,${a})`;ctx.beginPath();ctx.arc(x+q.vx*q.age,y+q.vy*q.age+150*q.age*q.age,q.size*a,0,7);ctx.fill();}});}
function shock(t){let p=clamp((t-1)/2.2,0,1);if(!p)return;ctx.save();ctx.globalAlpha=(1-p)*.85;ctx.strokeStyle='#ffdba0';ctx.lineWidth=7*(1-p)+1;ctx.shadowColor='#fff0bc';ctx.shadowBlur=22;ctx.beginPath();ctx.arc(width/2,height*.76,ease(p)*Math.max(width,height)*.8,0,7);ctx.stroke();ctx.restore();}
function mushroom(t){let p=clamp((t-2)/4,0,1);if(!p)return;let x=width/2,base=height*.73-ease(p)*height*.3;ctx.save();let g=ctx.createLinearGradient(x,base+110,x,base-60);g.addColorStop(0,'rgba(40,29,22,.88)');g.addColorStop(.55,'rgba(95,76,65,.72)');g.addColorStop(1,'rgba(130,120,108,.25)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-56,base+140);ctx.bezierCurveTo(x-20,base+50,x-45,base-20,x-105,base-45);ctx.bezierCurveTo(x-55,base-92,x+55,base-92,x+105,base-45);ctx.bezierCurveTo(x+45,base-20,x+20,base+50,x+56,base+140);ctx.fill();state.smoke.forEach((q,i)=>{let y=base-38+q.dy+Math.sin(t*.45+q.phase)*8,cx=x+q.dx+Math.sin(t*.3+q.phase)*14;ctx.fillStyle=`rgba(${55+(i%4)*16},${48+(i%4)*13},${42+(i%4)*12},${.16+p*.3})`;ctx.beginPath();ctx.arc(cx,y,q.size*(.7+p*.4),0,7);ctx.fill();});ctx.restore();}
function extras(t,dt){state.debris.forEach(q=>{q.age+=dt;if(q.age>q.life)return;ctx.save();ctx.translate(q.x+q.vx*q.age,q.y+q.vy*q.age+150*q.age*q.age);ctx.rotate(q.angle+q.spin*q.age);ctx.fillStyle=`rgba(65,48,34,${clamp(1-q.age/q.life,0,1)})`;ctx.fillRect(-q.size/2,-q.size/2,q.size,q.size*2);ctx.restore();});state.ash.forEach(q=>{ctx.fillStyle='rgba(178,178,170,.42)';ctx.fillRect(q.x+Math.sin(t*.7+q.phase)*15,q.y+q.vy*(t%8),q.size,q.size);});}
function draw(t,dt){ctx.save();let shake=clamp(1-Math.abs(t-1.5)/1.5,0,1)*13;ctx.translate(random(-shake,shake),random(-shake,shake));sky(t);landscape(t);shock(t);fire(t,dt);mushroom(t);extras(t,dt);ctx.restore();let a=t<.3?1:t<.65?1-(t-.3)/.35:0;if(a){ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fillRect(0,0,width,height);}}
function animate(now){let t=(now-start)/1000,dt=Math.min((now-last)/1000,.05);last=now;if(t>8){start=now;particles();t=0;}draw(t,dt);requestAnimationFrame(animate)}resize();particles();addEventListener('resize',resize);requestAnimationFrame(animate);
</script></body></html>
